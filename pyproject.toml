[project]
name = "play-mahjong-ai"
version = "0.1.0"
description = "MCR mahjong engine and training pipeline"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2",
  "onnx>=1.17",
  "onnxscript>=0.3",
  "onnxruntime>=1.20",
  "torch>=2.7",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["training"]
testpaths = ["training/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
