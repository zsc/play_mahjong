name: Validate browser release
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.2
      - run: opam install dune.3.24.2 yojson.3.0.0 js_of_ocaml.6.5.0 wasm_of_ocaml-compiler.6.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Compile the shared rules and prepare verified model
        run: OPAM_SWITCH=$(opam switch show) npm run prepare:assets
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          MAHJONG_BASE: /play_mahjong/
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Test the production site before publishing
        run: npm run test:release
        working-directory: web
        env:
          STATIC_TEST_URL: http://127.0.0.1:4174/play_mahjong/
      - uses: actions/upload-artifact@v4
        with:
          name: verified-static-site
          path: web/dist
